<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Admin Menu | Lilac's Cafeteria</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/admin.css">
    </head>
    <body class="admin-body">
        <div class="admin-shell">
            <aside class="admin-sidebar">
                <div class="admin-sidebar-logo-wrap">
                    <img src="../images/lilac_logo.jpg" alt="Lilac's Cafeteria" class="admin-sidebar-logo">
                    <div class="small text-muted mt-2">Signed in as <b id="adminCurrentUser">admin</b></div>
                </div>

                <nav class="admin-nav-list" aria-label="Admin navigation">
                    <a href="orders.html" class="admin-nav-link"><i class="bi bi-card-checklist"></i> Orders</a>
                    <a href="menu.html" class="admin-nav-link active"><i class="bi bi-list-ul"></i> Menu</a>
                    <a href="business.html" class="admin-nav-link"><i class="bi bi-briefcase-fill"></i> Business</a>
                    <a href="users.html" class="admin-nav-link"><i class="bi bi-person-fill"></i> Accounts</a>
                </nav>

                <button type="button" id="adminLogoutBtn" class="admin-logout-btn">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </aside>

            <main class="admin-main">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                    <h1 class="admin-page-title">Menu</h1>
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <div class="admin-search-wrap">
                            <input type="search" id="menuSearchInput" class="form-control admin-search-input" placeholder="Search menu items...">
                            <i class="bi bi-search"></i>
                        </div>
                        <button type="button" id="addNewItemBtn" class="btn btn-outline-dark rounded-pill fw-semibold bg-white px-3">
                            <i class="bi bi-plus-lg me-1"></i> Add New Item
                        </button>
                        <button type="button" id="manageCategoriesBtn" class="btn btn-admin-lilac px-3" data-bs-toggle="modal" data-bs-target="#categoriesModal">
                            <i class="bi bi-tags me-1"></i> Categories
                        </button>
                    </div>
                </div>

                <div id="categoryFilterBar" class="d-flex flex-wrap gap-2 mb-4"></div>
                <div id="menuFeedback" class="alert d-none mb-3" role="alert"></div>
                <div id="adminMenuList">
                    <div class="text-center py-5 text-muted">Loading menu items...</div>
                </div>
            </main>
        </div>

        <!-- Add / Edit Item Modal (Wireframe Page 14) -->
        <div class="modal fade" id="itemModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content p-3" style="background-color: var(--cream-bg); border: 1.5px solid var(--text-dark); border-radius: 18px;">
                    <div class="modal-header border-0 pb-1">
                        <h2 class="modal-title fs-3 fw-bold" style="color: var(--lilac-dark);" id="itemModalTitle">Edit Item</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div class="text-center mb-3">
                            <img id="itemPreviewImg" src="/images/lilac_logo.jpg" alt="Item preview" style="width: 180px; height: 120px; object-fit: cover; border-radius: 14px; border: 1.5px solid #c9bcd2; background: #fff;">
                        </div>

                        <form id="itemForm" novalidate>
                            <input type="hidden" id="itemIdField">
                            <div class="mb-3">
                                <label for="itemNameField" class="form-label fw-semibold" style="color: var(--lilac-dark);">Item Name</label>
                                <input type="text" id="itemNameField" class="form-control admin-rounded-input" maxlength="100" required>
                            </div>
                            <div class="mb-3">
                                <label for="itemPriceField" class="form-label fw-semibold" style="color: var(--lilac-dark);">Item Price (₱)</label>
                                <input type="number" step="0.01" min="0" id="itemPriceField" class="form-control admin-rounded-input" required>
                            </div>
                            <div class="mb-3">
                                <label for="itemCategoryField" class="form-label fw-semibold" style="color: var(--lilac-dark);">Category</label>
                                <select id="itemCategoryField" class="form-select admin-rounded-input" required></select>
                            </div>
                            <div class="mb-3">
                                <label for="itemDescField" class="form-label fw-semibold" style="color: var(--lilac-dark);">Description (Optional)</label>
                                <input type="text" id="itemDescField" class="form-control admin-rounded-input" placeholder="e.g. Served with java rice and soup.">
                            </div>
                            <div class="mb-3">
                                <label for="itemImageField" class="form-label fw-semibold" style="color: var(--lilac-dark);">Image Path (Optional)</label>
                                <input type="text" id="itemImageField" class="form-control admin-rounded-input" placeholder="/images/order/sizzling/siz_sisig.jpg" maxlength="255">
                            </div>
                            <div class="form-check form-switch mb-3">
                                <input class="form-check-input" type="checkbox" id="itemAvailableField" checked>
                                <label class="form-check-label fw-semibold" for="itemAvailableField">Available for online ordering</label>
                            </div>

                            <div id="itemFormError" class="alert alert-danger py-2 small d-none"></div>

                            <div class="d-grid gap-2 mt-3">
                                <button type="submit" class="btn btn-admin-lilac py-2 fs-5">Save Changes</button>
                                <button type="button" class="btn btn-outline-dark rounded-pill py-2 bg-white fw-semibold" data-bs-dismiss="modal">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Item Confirmation Modal (Wireframe Page 15) -->
        <div class="modal fade" id="deleteItemModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content text-center p-4" style="background-color: var(--cream-bg); border: 1.5px solid var(--text-dark); border-radius: 18px;">
                    <div class="delete-alert-icon">!</div>
                    <h2 class="h4 fw-bold mb-2">Are you sure?</h2>
                    <p class="small mb-4" id="deleteItemPrompt">Are you sure you want to delete this item?</p>
                    <div class="d-grid gap-2">
                        <button type="button" id="confirmDeleteItemBtn" class="btn btn-dark rounded-pill fw-semibold py-2">Delete Item</button>
                        <button type="button" class="btn btn-outline-dark rounded-pill fw-semibold py-2 bg-white" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Categories Management Modal (CRUD for category table) -->
        <div class="modal fade" id="categoriesModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content" style="background-color: var(--cream-bg); border: 1.5px solid var(--text-dark); border-radius: 18px;">
                    <div class="modal-header">
                        <h2 class="modal-title fs-4 fw-bold" style="color: var(--lilac-dark);">Manage Categories</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="categoryModalError" class="alert alert-danger py-2 small d-none"></div>

                        <form id="categoryForm" class="bg-white border rounded p-3 mb-4">
                            <input type="hidden" id="catIdField">
                            <div class="row g-2 align-items-end">
                                <div class="col-12 col-sm-4">
                                    <label class="form-label small fw-bold">Slug Name</label>
                                    <input type="text" id="catNameField" class="form-control form-control-sm" placeholder="e.g. sizzling_specials" maxlength="50" required>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <label class="form-label small fw-bold">Display Name</label>
                                    <input type="text" id="catDisplayField" class="form-control form-control-sm" placeholder="e.g. Sizzling Specials" maxlength="100" required>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="checkbox" id="catFeeField">
                                        <label class="form-check-label small fw-bold" for="catFeeField">Has Takeout Fee</label>
                                    </div>
                                    <div class="d-flex gap-1">
                                        <button type="submit" id="catSubmitBtn" class="btn btn-admin-lilac btn-sm flex-grow-1">Add Category</button>
                                        <button type="button" id="catCancelEditBtn" class="btn btn-outline-secondary btn-sm d-none">Reset</button>
                                    </div>
                                </div>
                            </div>
                        </form>

                        <div class="table-responsive bg-white border rounded">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Display Name</th>
                                        <th>Slug</th>
                                        <th>Takeout Fee</th>
                                        <th class="text-end">Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="categoriesTableBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/admin/common.js"></script>
        <script src="../js/admin/menu.js"></script>
    </body>
</html>
