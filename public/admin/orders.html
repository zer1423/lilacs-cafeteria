<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Admin Orders | Lilac's Cafeteria</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/admin.css">
    </head>
    <body class="admin-body">
        <div class="admin-shell">
            <aside class="admin-sidebar">
                <div class="admin-sidebar-logo-wrap">
                    <img src="../images/lilac_logo.jpg" alt="Lilac's Cafeteria" class="admin-sidebar-logo">
                    <div class="small text-muted mt-2">Signed in as <b id="adminCurrentUser">admin</b></div>
                </div>

                <nav class="admin-nav-list" aria-label="Admin navigation">
                    <a href="orders.html" class="admin-nav-link active"><i class="bi bi-card-checklist"></i> Orders</a>
                    <a href="menu.html" class="admin-nav-link"><i class="bi bi-list-ul"></i> Menu</a>
                    <a href="business.html" class="admin-nav-link"><i class="bi bi-briefcase-fill"></i> Business</a>
                    <a href="users.html" class="admin-nav-link"><i class="bi bi-person-fill"></i> Accounts</a>
                </nav>

                <button type="button" id="adminLogoutBtn" class="admin-logout-btn">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </aside>

            <main class="admin-main">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-3">
                    <h1 class="admin-page-title">Active Orders</h1>
                    <div class="admin-search-wrap">
                        <input type="search" id="orderSearchInput" class="form-control admin-search-input" placeholder="Search order #, name, ref...">
                        <i class="bi bi-search"></i>
                    </div>
                </div>

                <div id="statusFilterBar" class="d-flex flex-wrap gap-2 mb-4">
                    <button type="button" class="admin-filter-pill active" data-status="">All</button>
                    <button type="button" class="admin-filter-pill" data-status="pending">Pending</button>
                    <button type="button" class="admin-filter-pill" data-status="preparing">Preparing</button>
                    <button type="button" class="admin-filter-pill" data-status="ready_for_pickup">Ready</button>
                    <button type="button" class="admin-filter-pill" data-status="picked_up">Complete</button>
                    <button type="button" class="admin-filter-pill" data-status="cancelled">Cancelled</button>
                </div>

                <div id="ordersFeedback" class="alert d-none mb-3" role="alert"></div>

                <div id="ordersGrid" class="row g-3">
                    <div class="col-12 text-center py-5 text-muted">Loading orders...</div>
                </div>
            </main>
        </div>

        <!-- Order Detail & Edit Modal (supports full CRUD on orders & order_item for pending orders) -->
        <div class="modal fade" id="orderDetailModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-lg modal-dialog-scrollable">
                <div class="modal-content" style="background-color: var(--cream-bg); border: 1.5px solid var(--text-dark); border-radius: 16px;">
                    <div class="modal-header">
                        <h2 class="modal-title fs-4 fw-bold" style="color: var(--lilac-dark);" id="modalOrderTitle">Order #0</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <div id="modalOrderError" class="alert alert-danger py-2 small d-none"></div>

                        <div class="d-flex flex-wrap justify-content-between align-items-center gap-2 mb-3 p-2 rounded bg-white border">
                            <div>
                                <span class="text-muted small">Status:</span>
                                <span id="modalOrderStatusBadge" class="status-badge ms-1">pending</span>
                            </div>
                            <div class="fw-bold" style="color: var(--lilac-dark);">
                                Payment Ref (QR Ph): <span id="modalOrderRefDisplay" class="badge bg-dark fs-6"></span>
                            </div>
                        </div>

                        <form id="orderDetailsForm" class="mb-4">
                            <div class="row g-3">
                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-bold">Customer Name</label>
                                    <input type="text" id="editCustomerName" class="form-control" maxlength="100" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-bold">Phone</label>
                                    <input type="text" id="editPhone" class="form-control" maxlength="20" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-bold">Email</label>
                                    <input type="email" id="editEmail" class="form-control" maxlength="100">
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-bold">Payment Reference</label>
                                    <input type="text" id="editPaymentRef" class="form-control" maxlength="30" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-bold">Pickup Time</label>
                                    <input type="datetime-local" id="editPickupTime" class="form-control" required>
                                </div>
                                <div class="col-12 col-md-6">
                                    <label class="form-label small fw-bold">Notes</label>
                                    <input type="text" id="editNotes" class="form-control" maxlength="255">
                                </div>
                            </div>
                            <div class="mt-3 text-end">
                                <button type="submit" id="saveOrderDetailsBtn" class="btn btn-admin-lilac btn-sm px-4">
                                    Save Order Details
                                </button>
                            </div>
                        </form>

                        <h3 class="h6 fw-bold border-bottom pb-2">Order Items</h3>
                        <div class="table-responsive bg-white rounded border mb-3">
                            <table class="table table-sm align-middle mb-0">
                                <thead>
                                    <tr>
                                        <th>Item</th>
                                        <th style="width: 130px;">Qty</th>
                                        <th class="text-end">Unit Price</th>
                                        <th class="text-end">Line Total</th>
                                        <th class="text-end" style="width: 60px;"></th>
                                    </tr>
                                </thead>
                                <tbody id="modalOrderItemsBody"></tbody>
                            </table>
                        </div>

                        <div id="addOrderItemRow" class="row g-2 align-items-end mb-3">
                            <div class="col-12 col-sm-7">
                                <label class="form-label small fw-bold mb-1">Add Item to Pending Order</label>
                                <select id="addOrderItemSelect" class="form-select form-select-sm"></select>
                            </div>
                            <div class="col-6 col-sm-2">
                                <label class="form-label small fw-bold mb-1">Qty</label>
                                <input type="number" id="addOrderItemQty" class="form-control form-control-sm" value="1" min="1">
                            </div>
                            <div class="col-6 col-sm-3">
                                <button type="button" id="addOrderItemBtn" class="btn btn-admin-lilac btn-sm w-100">Add Item</button>
                            </div>
                        </div>

                        <div class="bg-white rounded border p-3">
                            <div class="d-flex justify-content-between small mb-1">
                                <span>Subtotal</span>
                                <span id="modalSubtotal">₱0.00</span>
                            </div>
                            <div class="d-flex justify-content-between small mb-1">
                                <span>Takeout Fee</span>
                                <span id="modalTakeoutFee">₱0.00</span>
                            </div>
                            <div class="d-flex justify-content-between fw-bold fs-5 border-top pt-2" style="color: var(--lilac-dark);">
                                <span>Total</span>
                                <span id="modalTotal">₱0.00</span>
                            </div>
                        </div>
                    </div>
                    <div class="modal-footer justify-content-between">
                        <div id="modalStatusActions" class="d-flex flex-wrap gap-2"></div>
                        <button type="button" class="btn btn-outline-secondary rounded-pill px-4" data-bs-dismiss="modal">Close</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete Cancelled Order Modal (Wireframe Page 15 style) -->
        <div class="modal fade" id="deleteOrderModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content text-center p-4" style="background-color: var(--cream-bg); border: 1.5px solid var(--text-dark); border-radius: 18px;">
                    <div class="delete-alert-icon">!</div>
                    <h2 class="h4 fw-bold mb-2">Are you sure?</h2>
                    <p class="small mb-4" id="deleteOrderPrompt">Are you sure you want to delete this cancelled order?</p>
                    <div class="d-grid gap-2">
                        <button type="button" id="confirmDeleteOrderBtn" class="btn btn-dark rounded-pill fw-semibold py-2">Delete Order</button>
                        <button type="button" class="btn btn-outline-dark rounded-pill fw-semibold py-2 bg-white" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/admin/common.js"></script>
        <script src="../js/admin/orders.js"></script>
    </body>
</html>
