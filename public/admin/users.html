<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Admin Accounts | Lilac's Cafeteria</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/admin.css">
    </head>
    <body class="admin-body">
        <div class="admin-shell">
            <aside class="admin-sidebar">
                <div class="admin-sidebar-logo-wrap">
                    <img src="../images/lilac_logo.jpg" alt="Lilac's Cafeteria" class="admin-sidebar-logo">
                    <div class="small text-muted mt-2">Signed in as <b id="adminCurrentUser">admin</b></div>
                </div>

                <nav class="admin-nav-list" aria-label="Admin navigation">
                    <a href="orders.html" class="admin-nav-link"><i class="bi bi-card-checklist"></i> Orders</a>
                    <a href="menu.html" class="admin-nav-link"><i class="bi bi-list-ul"></i> Menu</a>
                    <a href="business.html" class="admin-nav-link"><i class="bi bi-briefcase-fill"></i> Business</a>
                    <a href="users.html" class="admin-nav-link active"><i class="bi bi-person-fill"></i> Accounts</a>
                </nav>

                <button type="button" id="adminLogoutBtn" class="admin-logout-btn">
                    <i class="bi bi-box-arrow-left"></i> Logout
                </button>
            </aside>

            <main class="admin-main">
                <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
                    <h1 class="admin-page-title">Admin Accounts</h1>
                    <button type="button" id="addAdminBtn" class="btn btn-outline-dark rounded-pill fw-semibold bg-white px-4 py-2">
                        <i class="bi bi-plus-lg me-1"></i> Add Admin
                    </button>
                </div>

                <div id="usersFeedback" class="alert d-none mb-3" role="alert"></div>

                <div class="admin-table-card">
                    <div class="table-responsive">
                        <table class="table align-middle mb-0">
                            <thead class="table-light">
                                <tr>
                                    <th class="ps-4 py-3">ID</th>
                                    <th class="py-3">Username</th>
                                    <th class="pe-4 py-3 text-end">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="adminsTableBody">
                                <tr><td colspan="3" class="text-center py-4 text-muted">Loading accounts...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>

        <!-- Add / Edit User Modal (Wireframe Page 16) -->
        <div class="modal fade" id="userModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content p-3" style="background-color: var(--cream-bg); border: 1.5px solid var(--text-dark); border-radius: 18px;">
                    <div class="modal-header border-0 pb-1">
                        <h2 class="modal-title fs-3 fw-bold" style="color: var(--lilac-dark);" id="userModalTitle">Edit User</h2>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                    </div>
                    <div class="modal-body">
                        <form id="userForm" novalidate>
                            <input type="hidden" id="userIdField">
                            <div class="mb-3">
                                <label for="userUsernameField" class="form-label fw-semibold" style="color: var(--lilac-dark);">Username</label>
                                <input type="text" id="userUsernameField" class="form-control admin-rounded-input" maxlength="50" required>
                            </div>
                            <div class="mb-3">
                                <label for="userPasswordField" class="form-label fw-semibold" style="color: var(--lilac-dark);">Password</label>
                                <input type="password" id="userPasswordField" class="form-control admin-rounded-input" minlength="6">
                                <div id="passwordHelp" class="form-text">Minimum 6 characters.</div>
                            </div>

                            <div id="userFormError" class="alert alert-danger py-2 small d-none"></div>

                            <div class="d-grid gap-2 mt-4">
                                <button type="submit" class="btn btn-admin-lilac py-2 fs-5">Save Changes</button>
                                <button type="button" class="btn btn-outline-dark rounded-pill py-2 bg-white fw-semibold" data-bs-dismiss="modal">Cancel</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Delete User Modal (Wireframe Page 17) -->
        <div class="modal fade" id="deleteUserModal" tabindex="-1" aria-hidden="true">
            <div class="modal-dialog modal-dialog-centered modal-sm">
                <div class="modal-content text-center p-4" style="background-color: var(--cream-bg); border: 1.5px solid var(--text-dark); border-radius: 18px;">
                    <div class="delete-alert-icon">!</div>
                    <h2 class="h4 fw-bold mb-2">Are you sure?</h2>
                    <p class="small mb-4" id="deleteUserPrompt">Are you sure you want to delete this user?</p>
                    <div class="d-grid gap-2">
                        <button type="button" id="confirmDeleteUserBtn" class="btn btn-dark rounded-pill fw-semibold py-2">Delete User</button>
                        <button type="button" class="btn btn-outline-dark rounded-pill fw-semibold py-2 bg-white" data-bs-dismiss="modal">Cancel</button>
                    </div>
                </div>
            </div>
        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/admin/common.js"></script>
        <script src="../js/admin/users.js"></script>
    </body>
</html>
