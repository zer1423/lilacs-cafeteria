<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <title>Admin Login | Lilac's Cafeteria</title>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
        <link rel="stylesheet" href="../css/admin.css">
    </head>
    <body class="admin-body">
        <div class="admin-login-bg">
            <a href="../index.html" class="admin-login-corner-logo" title="Back to Lilac's Cafeteria">
                <img src="../images/lilac_logo.jpg" alt="Lilac's Cafeteria Logo">
            </a>

            <div class="admin-login-card">
                <h1 class="h4 fw-bold text-center mb-4" style="color: var(--lilac-dark);">Admin Sign In</h1>
                <form id="loginForm" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Username</label>
                        <div class="admin-input-icon-wrap">
                            <input type="text" id="username" class="form-control admin-rounded-input" autocomplete="username" required>
                            <i class="bi bi-person-fill"></i>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-bold">Password</label>
                        <div class="admin-input-icon-wrap">
                            <input type="password" id="password" class="form-control admin-rounded-input" autocomplete="current-password" required>
                            <i class="bi bi-lock-fill"></i>
                        </div>
                    </div>

                    <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>

                    <div class="text-center">
                        <button type="submit" id="loginBtn" class="btn btn-admin-lilac px-5 py-2 fs-5">Login</button>
                    </div>
                </form>
            </div>
        </div>

        <script>
            document.addEventListener('DOMContentLoaded', async () => {
                // Redirect if already signed in
                try {
                    const meRes = await fetch('/api/admin/me');
                    if (meRes.ok) {
                        window.location.href = '/admin/orders.html';
                        return;
                    }
                } catch {}

                const form = document.getElementById('loginForm');
                const errEl = document.getElementById('loginError');
                const loginBtn = document.getElementById('loginBtn');

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    errEl.classList.add('d-none');

                    const username = document.getElementById('username').value.trim();
                    const password = document.getElementById('password').value;

                    if (!username || !password) {
                        errEl.textContent = 'Username and password are required.';
                        errEl.classList.remove('d-none');
                        return;
                    }

                    loginBtn.disabled = true;
                    loginBtn.textContent = 'Signing in...';

                    try {
                        const res = await fetch('/api/admin/login', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ username, password })
                        });
                        const data = await res.json();
                        if (!res.ok) {
                            errEl.textContent = data.error || 'Invalid credentials.';
                            errEl.classList.remove('d-none');
                            loginBtn.disabled = false;
                            loginBtn.textContent = 'Login';
                            return;
                        }
                        window.location.href = '/admin/orders.html';
                    } catch {
                        errEl.textContent = 'Network error. Please try again.';
                        errEl.classList.remove('d-none');
                        loginBtn.disabled = false;
                        loginBtn.textContent = 'Login';
                    }
                });
            });
        </script>
    </body>
</html>
